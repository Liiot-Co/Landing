<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="grad-violet" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#5A228B" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#0B0710" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="grad-orange" cx="80%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#FF6A33" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0B0710" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FF8A5C" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0B0710" />
  <rect width="1200" height="630" fill="url(#grad-violet)" />
  <rect width="1200" height="630" fill="url(#grad-orange)" />

  <!-- Logo Mark -->
  <g transform="translate(100, 100)">
    <g transform="scale(0.8)">
      <path d="M50.4 78.5a75.1 75.1 0 0 0-28.5 6.9l24.2-65.7c.7-2 1.9-3.2 3.4-3.2h29c1.5 0 2.7 1.2 3.4 3.2l24.2 65.7s-11.6-7-28.5-7L67 45.5c-.4-1.7-1.6-2.8-2.9-2.8-1.3 0-2.5 1.1-2.9 2.7L50.4 78.5Zm-1.1 28.2Zm-4.2-20.2c-2 6.6-.6 15.8 4.2 20.2a17.5 17.5 0 0 1 .2-.7 5.5 5.5 0 0 1 5.7-4.5c2.8.1 4.3 1.5 4.7 4.7.2 1.1.2 2.3.2 3.5v.4c0 2.7.7 5.2 2.2 7.4a13 13 0 0 0 5.7 4.9v-.3l-.2-.3c-1.8-5.6-.5-9.5 4.4-12.8l1.5-1a73 73 0 0 0 3.2-2.2 16 16 0 0 0 6.8-11.4c.3-2 .1-4-.6-6l-.8.6-1.6 1a37 37 0 0 1-22.4 2.7c-5-.7-9.7-2-13.2-6.2Z" fill="#8B45CC" />
    </g>
    <text x="100" y="70" font-family="'Satoshi', system-ui, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" letter-spacing="-0.03em">Liiot</text>
  </g>

  <!-- Tagline / Title -->
  <text x="100" y="290" font-family="'Satoshi', system-ui, sans-serif" font-size="64" font-weight="900" fill="url(#text-gradient)" letter-spacing="-0.03em">
    Construimos tu futuro contigo.
  </text>

  <!-- Subtitle -->
  <text x="100" y="370" font-family="'Satoshi', system-ui, sans-serif" font-size="28" font-weight="500" fill="rgba(255, 255, 255, 0.75)">
    Tecnología con propósito. Software a medida, productos digitales y automatización.
  </text>

  <!-- Bottom Badges / URL -->
  <g transform="translate(100, 480)">
    <rect width="210" height="46" rx="23" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
    <text x="105" y="29" font-family="'Satoshi', system-ui, sans-serif" font-size="18" font-weight="600" fill="#FF8A5C" text-anchor="middle">
      liiot.dev
    </text>

    <text x="240" y="29" font-family="'Satoshi', system-ui, sans-serif" font-size="18" font-weight="500" fill="rgba(255, 255, 255, 0.5)">
      Hecho en Colombia · Impacto global
    </text>
  </g>
</svg>
